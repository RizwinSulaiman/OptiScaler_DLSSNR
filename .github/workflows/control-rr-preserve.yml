name: CONTROL RR Preserve

on:
  push:
    branches:
      - exp/control-rr-preserve
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reference-and-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Apply default-off CONTROL integration patch
        shell: pwsh
        run: |
          python experiments/control_rr_preserve/apply_integration.py
          git diff --check
          git diff -- OptiScaler/Config.h OptiScaler/Config.cpp OptiScaler/shaders/dlssnr/DlssNr_Dx12.cpp

      - name: Build and run RR-preserve reference tests
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cl /nologo /std:c++20 /EHsc /W4 /WX experiments\control_rr_preserve\test_rr_preserve.cpp /Fe:rr_preserve_test.exe
          rr_preserve_test.exe

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build patched OptiScaler Release
        shell: cmd
        run: msbuild /m /p:Configuration=Release . /verbosity:minimal
