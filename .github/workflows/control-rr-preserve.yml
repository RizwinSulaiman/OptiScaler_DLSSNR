name: CONTROL RR Preserve

on:
  push:
    branches:
      - exp/control-rr-preserve
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reference-and-build:
    # The project is v143. Pin the runner instead of following windows-latest to the VS2026 image.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Apply CONTROL integration and upstream safety patch
        shell: pwsh
        run: |
          python experiments/control_rr_preserve/apply_integration.py
          python experiments/control_rr_preserve/normalize_materialized_utf8.py
          git diff --check
          git diff -- OptiScaler/Config.h OptiScaler/Config.cpp OptiScaler/shaders/dlssnr/DlssNr_Dx12.cpp OptiScaler.ini OptiScaler/hooks/Streamline_Hooks.cpp OptiScaler/misc/Quirks.h OptiScaler/dllmain.cpp

      - name: Verify FSR4, FSR SDK and CONTROL pins
        shell: pwsh
        run: python experiments/control_rr_preserve/verify_upstream_pins.py

      - name: Verify tracked neural upstream snapshots
        shell: pwsh
        run: |
          $pins = Get-Content experiments/control_rr_preserve/upstream_pins.json | ConvertFrom-Json

          function Assert-GitCommit([string]$Name, [string]$Repo, [string]$Commit) {
            $safe = ($Name -replace '[^A-Za-z0-9_.-]', '_')
            $dir = Join-Path $env:RUNNER_TEMP $safe
            git init $dir | Out-Null
            git -C $dir remote add origin ("https://github.com/" + $Repo + ".git")
            git -C $dir fetch --depth=1 origin $Commit
            if ($LASTEXITCODE -ne 0) { throw "$Name fetch failed" }
            $actual = (git -C $dir rev-parse FETCH_HEAD).Trim()
            if ($actual -ne $Commit) { throw "$Name pin mismatch: expected $Commit got $actual" }
            Write-Host "$Name verified: $actual"
          }

          Assert-GitCommit "lmxxf-stable-0.39" $pins.lmxxf_rdna4.repository $pins.lmxxf_rdna4.stable_release_commit
          Assert-GitCommit "lmxxf-quality-safe-production" $pins.lmxxf_rdna4.repository $pins.lmxxf_rdna4.source_commit
          Assert-GitCommit "lmxxf-latest-seen" $pins.lmxxf_rdna4.repository $pins.lmxxf_rdna4.latest_repo_commit_seen
          Assert-GitCommit "daniel-public-0.5.1" $pins.daniel_runtime.repository $pins.daniel_runtime.release_commit
          Assert-GitCommit "mochizuki-0.0.3" $pins.mochizuki_dlssnr_amd.repository $pins.mochizuki_dlssnr_amd.source_commit
          Assert-GitCommit "theautomatic-1.9.9.1" $pins.theautomatic.repository $pins.theautomatic.source_commit
          Assert-GitCommit "amdnr-0.3.5-release" $pins.amdnr.repository $pins.amdnr.core_release_commit
          Assert-GitCommit "amdnr-latest-seen" $pins.amdnr.repository $pins.amdnr.latest_repo_commit_seen

          Write-Host "Quality gate: lmxxf lossy fast tier, 1088-row mode and adaptive reuse remain off; Daniel Reference is the quality baseline; open lmxxf PR #12 remains tracked-only."

      - name: Build and run RR-preserve reference tests
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { throw "vswhere.exe not found" }
          $install = (& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath).Trim()
          if (-not $install) { throw "MSVC C++ tools not found" }
          $devcmd = Join-Path $install "Common7\Tools\VsDevCmd.bat"
          if (-not (Test-Path $devcmd)) { throw "VsDevCmd.bat not found at $devcmd" }
          $cmd = '"' + $devcmd + '" -arch=amd64 -host_arch=amd64 && cl /nologo /std:c++20 /EHsc /W4 /WX experiments\control_rr_preserve\test_rr_preserve.cpp /Fe:rr_preserve_test.exe && rr_preserve_test.exe'
          cmd.exe /d /s /c $cmd
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build patched OptiScaler Release x64
        shell: pwsh
        run: |
          msbuild OptiScaler.sln /m /p:Configuration=Release /p:Platform=x64 /verbosity:minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload validated CONTROL build
        uses: actions/upload-artifact@v4
        with:
          name: control-rr-preserve-x64
          if-no-files-found: error
          retention-days: 7
          path: |
            x64/Release/a/OptiScaler.dll
            x64/Release/a/nvngx.dll_dlssnr.dll
            x64/Release/a/OptiScaler/amd_fidelityfx_loader_dx12.dll
            x64/Release/a/OptiScaler/amd_fidelityfx_upscaler_dx12.dll
            x64/Release/a/OptiScaler/amd_fidelityfx_framegeneration_dx12.dll

      - name: Materialize validated integration patch
        if: github.ref == 'refs/heads/exp/control-rr-preserve'
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add OptiScaler/Config.h OptiScaler/Config.cpp OptiScaler/shaders/dlssnr/DlssNr_Dx12.cpp OptiScaler.ini OptiScaler/hooks/Streamline_Hooks.cpp OptiScaler/misc/Quirks.h OptiScaler/dllmain.cpp
          if (git diff --cached --quiet) {
            Write-Host "Integration already materialized."
          } else {
            git commit -m "exp: materialize CONTROL FSR4 and stability sync"
            git push origin HEAD:exp/control-rr-preserve
          }
