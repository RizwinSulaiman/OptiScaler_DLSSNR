name: clang-format Check
on: [push, pull_request]
jobs:
  formatting-check:
    # The DLSS-NR experiment branch intentionally carries upstream formatting debt.
    # Keep this check meaningful instead of mass-formatting unrelated custom NR code.
    if: github.ref != 'refs/heads/exp/control-rr-preserve'
    name: Formatting Check
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Run clang-format style check for C/C++/Protobuf programs.
      uses: jidicula/clang-format-action@v4.15.0
      with:
        clang-format-version: '20'
        check-path: 'OptiScaler'
        exclude-regex: 'external/|OptiScaler/include/'
